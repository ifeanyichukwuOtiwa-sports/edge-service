spring:
  application:
    name: edge-service
  lifecycle:
    timeout-per-shutdown-phase: PT15S
  cloud:
    gateway:
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:9001}/books
          predicates:
            - Path=/books/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:9002}/orders
          predicates:
            - Path=/orders/**


server:
  port: 9000
  netty:
    connection-timeout: PT2S
    idle-timeout: PT15S
  shutdown: graceful

