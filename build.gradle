plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'iwo.wintech'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}


dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${SPRING_CLOUD_VERSION}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

bootBuildImage {
	builder = "docker.io/paketobuildpacks/builder-jammy-base"
	imageName = "${ project.name }"
	environment = ["BP_JVM_VERSION" : "21-ubi9-minimal",
				   "BP_IMAGE_LABELS": "org.opencontainers.image.source=${ VCS_PROVIDER }/${ VCS_OWNER }/${ REPOSITORY } org.opencontainers.image.description=${project.name}-Image"
	]

	docker {
		publishRegistry {
			imageName = "${ CONTAINER_REGISTRY }/${ VCS_OWNER }/${ project.name }"
			username = project.findProperty("REGISTRY_USERNAME")
			password = project.findProperty("REGISTRY_TOKEN")
			url = project.findProperty("REGISTRY_URL")
		}
	}
}
